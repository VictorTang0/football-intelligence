name: MATCH IQ Autopilot Workflow

on:
  schedule:
    # 3 consolidated cron rules covering:
    # 1) 0 3 * * * -> 11:00 AM Beijing Time Daily Initial
    # 2) 0 4-11 * * * -> 12:00-19:00 Beijing Time Hourly Monitor
    # 3) 0,30 12-14 * * * -> 20:00-22:30 Beijing Time High-Freq & Closing Summaries
    - cron: '0 3 * * *'
    - cron: '0 4-11 * * *'
    - cron: '0,30 12-14 * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push current summary table'
        required: false
        default: 'true'

jobs:
  autopilot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz requests

      - name: Run MATCH IQ Orchestrator & Live Push
        env:
          TZ: "Asia/Shanghai" # Force timezone context
        run: |
          python scripts/autopilot_orchestrator.py
          python scripts/update_odds_and_news.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated hourly odds & prediction push [skip ci]" && git push)
