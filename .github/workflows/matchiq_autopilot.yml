name: MATCH IQ Autopilot Workflow

on:
  schedule:
    # 3 consolidated cron rules covering:
    # 1) 0 3 * * * -> 11:00 AM Beijing Time Daily Initial
    # 2) 0 4-11 * * * -> 12:00-19:00 Beijing Time Hourly Monitor
    # 3) 0,30 12-14 * * * -> 20:00-22:30 Beijing Time High-Freq & Closing Summaries
    - cron: '0 3 * * *'
    - cron: '0 4-11 * * *'
    - cron: '0,30 12-14 * * *'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push current summary table'
        required: false
        default: 'true'

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-path: '3.10'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz

      - name: Run MATCH IQ Orchestrator
        env:
          TZ: "Asia/Shanghai" # Force timezone context
        run: |
          if [ "${{ github.event.inputs.force_push }}" = "true" ]; then
            python scripts/autopilot_orchestrator.py --force-push
          else
            python scripts/autopilot_orchestrator.py
          fi
